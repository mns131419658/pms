<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登入 - 專案管理系統</title>
  <link rel="icon" type="image/jpeg" href="/img/logo.jpg">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm">
      <img class="logo" src="/img/logo.jpg" alt="公司標誌">
      <h1>專案管理系統</h1>
      <div class="field">
        <label for="emp_id">員工代號</label>
        <input type="text" id="emp_id" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn block" id="loginBtn">登入</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('loginBtn');

    // 若已登入直接進入系統
    fetch('/api/me').then(r => { if (r.ok) location.href = '/app.html'; });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg'; msg.textContent = '';
      btn.disabled = true; btn.textContent = '登入中...';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            emp_id: document.getElementById('emp_id').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (res.ok) {
          location.href = '/app.html';
        } else {
          msg.className = 'msg error';
          msg.textContent = data.error || '登入失敗。';
        }
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = '無法連線伺服器，請稍後再試。';
      } finally {
        btn.disabled = false; btn.textContent = '登入';
      }
    });
  </script>
</body>
</html>
